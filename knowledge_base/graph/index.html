<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Engineering KB — Knowledge Graph</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Force Graph Library (2D Canvas Engine) -->
  <script src="https://unpkg.com/force-graph@1.43.4/dist/force-graph.min.js"></script>

  <!-- Marked Markdown Renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Load Graph Data -->
  <script src="graph_data.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 18, 30, 0.85);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #a855f7;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #graph-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Single Unified Top Control Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none; /* Let background clicks pass through */
    }

    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }

    .stats-badge {
      font-size: 0.75rem;
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-family: 'Fira Code', monospace;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 7px 12px 7px 34px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
      width: 260px;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
    }

    /* Filter Pills Bar */
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .pill {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .pill:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(30, 41, 59, 0.9);
    }

    .pill.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Action Buttons */
    .btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--accent-purple);
      color: #fff;
    }

    /* Side Inspector Drawer */
    .drawer {
      position: absolute;
      top: 0;
      right: -480px;
      width: 460px;
      height: 100vh;
      background: rgba(10, 14, 24, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--panel-border);
      z-index: 20;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -20px 0 40px rgba(0, 0, 0, 0.7);
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .drawer-close {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .drawer-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .drawer-body {
      padding: 24px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .meta-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }

    .summary-card {
      background: rgba(30, 41, 59, 0.4);
      border-left: 3px solid var(--accent-purple);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #93c5fd;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .link-item:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .path-box {
      font-family: 'Fira Code', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      word-break: break-all;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .preview-box {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 260px;
      overflow-y: auto;
    }

    /* Hover Tooltip */
    #tooltip {
      position: absolute;
      z-index: 15;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      pointer-events: none;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    #tooltip strong {
      display: block;
      color: #fff;
      margin-bottom: 2px;
    }

    #tooltip span {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Top Controls Header -->
  <div class="top-bar">
    <div class="glass-card">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
        RE Knowledge Graph
      </div>
      <div class="stats-badge" id="stats-badge">53 Nodes • 146 Edges</div>

      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Search node title or tag...">
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filter-pills" id="filter-pills">
      <div class="pill active" data-topic="all">
        <span class="pill-dot" style="background: #fff;"></span> All Topics
      </div>
      <div class="pill" data-topic="rasp">
        <span class="pill-dot" style="background: #ef4444;"></span> RASP
      </div>
      <div class="pill" data-topic="protectors">
        <span class="pill-dot" style="background: #f59e0b;"></span> Protectors
      </div>
      <div class="pill" data-topic="arch">
        <span class="pill-dot" style="background: #3b82f6;"></span> Architecture
      </div>
      <div class="pill" data-topic="frida">
        <span class="pill-dot" style="background: #10b981;"></span> Frida
      </div>
      <div class="pill" data-topic="challenges">
        <span class="pill-dot" style="background: #ec4899;"></span> Challenges
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="glass-card" style="padding: 6px;">
      <button class="btn" id="btn-reset" title="Reset View">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        Reset
      </button>
      <button class="btn" id="btn-labels" title="Toggle Labels">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
        All Labels
      </button>
    </div>
  </div>

  <!-- Graph Container -->
  <div id="graph-container"></div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- Side Inspector Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title">Node Title</h2>
        <div class="meta-tags" id="drawer-meta-tags"></div>
      </div>
      <button class="drawer-close" id="drawer-close">&times;</button>
    </div>

    <div class="drawer-body">
      <div>
        <div class="section-title">Summary</div>
        <div class="summary-card" id="drawer-summary">Article summary...</div>
      </div>

      <div>
        <div class="section-title">File Path</div>
        <div class="path-box" id="drawer-path">knowledge_base/wiki/...</div>
      </div>

      <div>
        <div class="section-title">Connected Nodes</div>
        <div class="links-list" id="drawer-links"></div>
      </div>

      <div>
        <div class="section-title">Content Snippet</div>
        <div class="preview-box" id="drawer-preview">Markdown content preview...</div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.GRAPH_DATA) {
        console.error("GRAPH_DATA not found in graph_data.js");
        return;
      }

      const rawData = window.GRAPH_DATA;
      const container = document.getElementById("graph-container");
      const drawer = document.getElementById("drawer");
      const drawerClose = document.getElementById("drawer-close");
      const tooltip = document.getElementById("tooltip");
      const searchInput = document.getElementById("search-input");
      const filterPills = document.getElementById("filter-pills");
      const btnReset = document.getElementById("btn-reset");
      const btnLabels = document.getElementById("btn-labels");
      const statsBadge = document.getElementById("stats-badge");

      let selectedNode = null;
      let hoveredNode = null;
      let activeTopic = "all";
      let showAllLabels = false;

      // Update stats badge
      statsBadge.innerText = `${rawData.nodes.length} Nodes • ${rawData.links.length} Edges`;

      // Build connection set for rapid neighbor lookup
      const connectionMap = new Map();
      rawData.links.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        if (!connectionMap.has(s)) connectionMap.set(s, new Set());
        if (!connectionMap.has(t)) connectionMap.set(t, new Set());
        connectionMap.get(s).add(t);
        connectionMap.get(t).add(s);
      });

      // Initialize ForceGraph Engine
      const Graph = ForceGraph()(container)
        .graphData(rawData)
        .nodeId("id")
        .nodeVal(n => Math.min(18, 4 + Math.sqrt(n.val) * 2.2))
        .nodeColor(n => n.color || "#a855f7")
        .linkColor(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          if (hoveredNode && (s === hoveredNode.id || t === hoveredNode.id)) {
            return "#a855f7";
          }
          return "rgba(255, 255, 255, 0.12)";
        })
        .linkWidth(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          if (hoveredNode && (s === hoveredNode.id || t === hoveredNode.id)) {
            return 2.5;
          }
          return 1.2;
        })
        .linkDirectionalParticles(l => {
          const s = typeof l.source === 'object' ? l.source.id : l.source;
          const t = typeof l.target === 'object' ? l.target.id : l.target;
          return hoveredNode && (s === hoveredNode.id || t === hoveredNode.id) ? 3 : 0;
        })
        .linkDirectionalParticleWidth(2.5)
        .linkDirectionalParticleSpeed(0.006)
        .backgroundColor("#07090e")
        .onNodeHover(node => {
          hoveredNode = node;
          container.style.cursor = node ? "pointer" : "default";
          if (node) {
            tooltip.style.display = "block";
            tooltip.innerHTML = `<strong>${node.title}</strong><span>Topic: ${node.topic.toUpperCase()} • ${node.type}</span>`;
          } else {
            tooltip.style.display = "none";
          }
        })
        .onNodeClick(node => {
          openDrawer(node);
          Graph.centerAt(node.x, node.y, 400);
          Graph.zoom(2.8, 400);
        })
        .nodeCanvasObject((node, ctx, globalScale) => {
          const radius = Math.min(18, 4 + Math.sqrt(node.val) * 2.2);

          // Outer Glow ring on hover/selection
          if (hoveredNode && (hoveredNode.id === node.id || (connectionMap.get(hoveredNode.id) && connectionMap.get(hoveredNode.id).has(node.id)))) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, radius + 4, 0, 2 * Math.PI, false);
            ctx.fillStyle = node.color + "55";
            ctx.fill();
          }

          // Main Node Circle
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
          ctx.fillStyle = node.color || "#a855f7";
          ctx.fill();

          // Selection Ring
          if (selectedNode && selectedNode.id === node.id) {
            ctx.lineWidth = 2 / globalScale;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
          }

          // CLEAN SMART LABEL RENDERING Logic (Prevents Overlap Clutter!)
          const isMaster = node.topic === "_root" || node.id.includes("_index") || node.id.includes("hub");
          const isHovered = hoveredNode && (hoveredNode.id === node.id || (connectionMap.get(hoveredNode.id) && connectionMap.get(hoveredNode.id).has(node.id)));
          const isSelected = selectedNode && selectedNode.id === node.id;
          const highZoom = globalScale > 2.2;

          if (showAllLabels || isHovered || isSelected || isMaster || highZoom) {
            const fontSize = Math.max(10 / globalScale, 3);
            ctx.font = `${fontSize}px Inter, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const text = node.title;
            const textWidth = ctx.measureText(text).width;
            const padding = 3 / globalScale;
            const yPos = node.y + radius + fontSize + 2;

            // Semi-transparent text background pill for crisp legibility
            ctx.fillStyle = "rgba(7, 9, 14, 0.85)";
            ctx.fillRect(
              node.x - textWidth / 2 - padding,
              yPos - fontSize / 2 - padding,
              textWidth + padding * 2,
              fontSize + padding * 2
            );

            // Label text
            ctx.fillStyle = isHovered || isSelected || isMaster ? "#ffffff" : "#cbd5e1";
            ctx.fillText(text, node.x, yPos);
          }
        });

      // Tune D3 Force Physics for Clean Cluster Spacing
      Graph.d3Force('charge').strength(-320);
      Graph.d3Force('link').distance(80);

      // Tooltip position tracking
      window.addEventListener("mousemove", (e) => {
        tooltip.style.left = (e.clientX + 14) + "px";
        tooltip.style.top = (e.clientY + 14) + "px";
      });

      // Drawer Open Handler
      function openDrawer(node) {
        selectedNode = node;
        document.getElementById("drawer-title").innerText = node.title;
        document.getElementById("drawer-summary").innerText = node.summary;
        document.getElementById("drawer-path").innerText = node.rel_path;
        
        const tagsContainer = document.getElementById("drawer-meta-tags");
        tagsContainer.innerHTML = `
          <span class="meta-tag" style="border-color: ${node.color}; color: ${node.color}">${node.topic.toUpperCase()}</span>
          <span class="meta-tag">${node.type}</span>
          <span class="meta-tag">${node.complexity}</span>
        `;

        const linksContainer = document.getElementById("drawer-links");
        linksContainer.innerHTML = "";
        
        const connections = connectionMap.get(node.id) || new Set();
        if (connections.size === 0) {
          linksContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted);">No direct links discovered.</div>`;
        } else {
          connections.forEach(targetId => {
            const targetNode = rawData.nodes.find(n => n.id === targetId);
            if (targetNode) {
              const linkEl = document.createElement("div");
              linkEl.className = "link-item";
              linkEl.innerHTML = `<span>${targetNode.title}</span><span style="font-size:0.72rem; color:var(--text-muted)">${targetNode.topic}</span>`;
              linkEl.onclick = () => {
                openDrawer(targetNode);
                Graph.centerAt(targetNode.x, targetNode.y, 400);
              };
              linksContainer.appendChild(linkEl);
            }
          });
        }

        const previewContainer = document.getElementById("drawer-preview");
        if (window.marked) {
          previewContainer.innerHTML = marked.parse(node.content || "");
        } else {
          previewContainer.innerText = node.content || "";
        }

        drawer.classList.add("open");
      }

      drawerClose.addEventListener("click", () => {
        drawer.classList.remove("open");
        selectedNode = null;
      });

      // Topic Filter Pills
      filterPills.addEventListener("click", (e) => {
        const pill = e.target.closest(".pill");
        if (!pill) return;

        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        activeTopic = pill.getAttribute("data-topic");

        filterGraph();
      });

      // Search Bar Filter
      searchInput.addEventListener("input", () => {
        filterGraph();
      });

      // Reset View Button
      btnReset.addEventListener("click", () => {
        Graph.zoomToFit(400, 40);
      });

      // Toggle All Labels Button
      btnLabels.addEventListener("click", () => {
        showAllLabels = !showAllLabels;
        btnLabels.classList.toggle("active", showAllLabels);
      });

      function filterGraph() {
        const query = searchInput.value.toLowerCase().trim();

        const filteredNodes = rawData.nodes.filter(node => {
          const matchesTopic = activeTopic === "all" || node.topic === activeTopic;
          const matchesSearch = !query || 
            node.title.toLowerCase().includes(query) || 
            node.summary.toLowerCase().includes(query) ||
            (node.tags && node.tags.some(t => t.toLowerCase().includes(query)));

          return matchesTopic && matchesSearch;
        });

        const filteredNodeIds = new Set(filteredNodes.map(n => n.id));
        const filteredLinks = rawData.links.filter(l => {
          const sId = typeof l.source === 'object' ? l.source.id : l.source;
          const tId = typeof l.target === 'object' ? l.target.id : l.target;
          return filteredNodeIds.has(sId) && filteredNodeIds.has(tId);
        });

        Graph.graphData({ nodes: filteredNodes, links: filteredLinks });
      }
    });
  </script>
</body>
</html>
