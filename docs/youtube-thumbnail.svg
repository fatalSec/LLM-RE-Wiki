<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="32%" cy="38%" r="90%">
      <stop offset="0" stop-color="#18213a"/>
      <stop offset="55%" stop-color="#0c1120"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="feeds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#20304f" stroke-width="1" opacity="0.18">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>
  <!-- glow halo behind graph -->
  <circle cx="1000" cy="360" r="230" fill="#6d28d9" opacity="0.14" filter="url(#bigglow)"/>

  <!-- ===================== Right: knowledge graph ===================== -->
  <g stroke-width="2.5" opacity="0.55" stroke="#64748b">
    <line x1="1000" y1="360" x2="880" y2="235"/>
    <line x1="1000" y1="360" x2="1140" y2="255"/>
    <line x1="1000" y1="360" x2="905" y2="470"/>
    <line x1="1000" y1="360" x2="1120" y2="455"/>
    <line x1="880" y1="235" x2="1140" y2="255"/>
    <line x1="905" y1="470" x2="1120" y2="455"/>
    <line x1="1140" y1="255" x2="1120" y2="455"/>
    <line x1="880" y1="235" x2="820" y2="360"/>
    <line x1="820" y1="360" x2="905" y2="470"/>
    <line x1="1140" y1="255" x2="1195" y2="360"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="1000" cy="360" r="30" fill="#a855f7"/>
    <circle cx="880" cy="235" r="17" fill="#22d3ee"/>
    <circle cx="1140" cy="255" r="20" fill="#f59e0b"/>
    <circle cx="905" cy="470" r="16" fill="#22d3ee"/>
    <circle cx="1120" cy="455" r="18" fill="#f59e0b"/>
    <circle cx="820" cy="360" r="12" fill="#ec4899"/>
    <circle cx="1195" cy="360" r="12" fill="#10b981"/>
  </g>

  <!-- ===================== Left: text block ===================== -->
  <!-- eyebrow -->
  <circle cx="82" cy="119" r="7" fill="#22d3ee"/>
  <text x="102" y="127" font-size="22" font-weight="700" fill="#c4b5fd" letter-spacing="2">LLM AGENT · OPEN SOURCE</text>

  <!-- headline -->
  <text x="70" y="258" font-size="86" font-weight="800" fill="url(#head)" letter-spacing="-1">REVERSE</text>
  <text x="70" y="346" font-size="86" font-weight="800" fill="url(#head)" letter-spacing="-1">ENGINEERING</text>
  <text x="70" y="446" font-size="92" font-weight="800" letter-spacing="-1" fill="#f8fafc">KNOWLEDGE<tspan dx="26" fill="#f59e0b">BASE</tspan></text>

  <!-- subhead -->
  <text x="74" y="512" font-size="30" font-weight="500" fill="#94a3b8">Turn any blog or paper into a searchable AI wiki.</text>

  <!-- command chips -->
  <g filter="url(#glow)">
    <rect x="72" y="560" width="180" height="62" rx="31" fill="#2a1240" stroke="#c084fc" stroke-width="2.5"/>
    <rect x="268" y="560" width="200" height="62" rx="31" fill="#0c2e33" stroke="#22d3ee" stroke-width="2.5"/>
    <rect x="484" y="560" width="180" height="62" rx="31" fill="#33280a" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <text x="162" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#e9d5ff" letter-spacing="1">INGEST</text>
  <text x="368" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#a5f3fc" letter-spacing="1">COMPILE</text>
  <text x="574" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#fde68a" letter-spacing="1">SEARCH</text>
</svg>
